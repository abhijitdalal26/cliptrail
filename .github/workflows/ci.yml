name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps (Tauri, clipboard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Frontend build (needed by the Tauri crate)
        if: hashFiles('apps/desktop/package.json') != ''
        working-directory: apps/desktop
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Live NSPasteboard tests (#[ignore]d locally): write -> watcher fires
      # -> read back, plus concealed/transient-type skips. Serial: one
      # pasteboard shared by every test.
      - name: macOS live pasteboard tests
        if: runner.os == 'macOS'
        run: cargo test -p clipd-capture -- --ignored --test-threads=1

  linux-live-clipboard:
    name: Linux live clipboard tests (X11 + Wayland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Session tools (Xvfb for X11, sway headless for data-control Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip wl-clipboard sway libxcb-xfixes0-dev
      # Wayland env vars for the whole job; DISPLAY is set per-step.
      - name: Wayland runtime dir
        run: |
          mkdir -p "$RUNNER_TEMP/xdg" && chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-1" >> "$GITHUB_ENV"
      - name: X11 live tests under Xvfb
        env:
          WAYLAND_DISPLAY: ""
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            cargo test -p clipd-capture -- --ignored --test-threads=1
      - name: Wayland live tests under headless sway
        run: |
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman \
            sway -c /dev/null >sway.log 2>&1 &
          # wait for the socket instead of sleeping a fixed interval
          for i in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-1" ] && break
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/wayland-1"
          cargo test -p clipd-capture -- --ignored --test-threads=1
          kill %1 || true

  relay-image:
    name: Relay Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build docker/relay.Dockerfile (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/relay.Dockerfile
          push: false
          load: true
          tags: cliptrail-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name relay -p 8787:8787 cliptrail-relay:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/v1/hello && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/v1/hello | grep -q '"kind":"clipd-relay"'
          docker exec relay /usr/local/bin/clipd-relay --healthcheck
          docker rm -f relay
