name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps (Tauri, clipboard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Frontend build (needed by the Tauri crate)
        if: hashFiles('apps/desktop/package.json') != ''
        working-directory: apps/desktop
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  relay-image:
    name: Relay Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build docker/relay.Dockerfile (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/relay.Dockerfile
          push: false
          load: true
          tags: cliptrail-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name relay -p 8787:8787 cliptrail-relay:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/v1/hello && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/v1/hello | grep -q '"kind":"clipd-relay"'
          docker exec relay /usr/local/bin/clipd-relay --healthcheck
          docker rm -f relay
