name: Release

# Push a tag like v0.1.0 to build installers and publish a draft GitHub
# release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos (experimental)
            os: macos-latest
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ClipTrail ${{ github.ref_name }}"
          releaseBody: |
            Install: Windows → the `-setup.exe` (or `.msi`); Linux → `.deb` or `.AppImage`; macOS (experimental, untested) → `.dmg`.
            Builds are not code-signed yet: Windows shows "Windows protected your PC" → More info → Run anyway.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: clipd.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bin: clipd }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev
      - run: cargo build --release -p clipd-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="clipd-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$name/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "${{ github.ref_name }}" $(ls clipd-*.zip clipd-*.tar.gz 2>/dev/null) --clobber
