name: Release

# Push a tag like v0.1.0 to build installers and publish a draft GitHub
# release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos (experimental)
            os: macos-latest
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages (tauri.conf.json createUpdaterArtifacts).
          # The matching public key is in tauri.conf.json plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ClipTrail ${{ github.ref_name }}"
          releaseBody: |
            Install: Windows → the `-setup.exe` (or `.msi`); Android → the `.apk` (sideload; setup guide: https://abhijitdalal26.github.io/cliptrail/docs/android.html); Linux → `.deb` or `.AppImage`; macOS (experimental, untested) → `.dmg`.
            Builds are not code-signed yet: Windows shows "Windows protected your PC" → More info → Run anyway.
          releaseDraft: true
          prerelease: true
          # Uploads latest.json (+ .sig files) next to the installers; the app's
          # update check reads releases/latest/download/latest.json. Note that
          # "latest" skips drafts and pre-releases, so untick "pre-release"
          # when publishing a version you want installed apps to be offered.
          # (tauri-action v0 input; v1 calls it uploadUpdaterJson.)
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # Sideloaded APK (not on Play). The same key must sign every release or
      # installed apps can't update; see docs/release.md.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets are not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=cliptrail"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > apps/desktop/src-tauri/gen/android/keystore.properties
      - name: Build APK
        working-directory: apps/desktop
        run: pnpm tauri android build --apk --target aarch64
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n1)
          test -n "$apk" || { echo "::error::no release APK found"; exit 1; }
          ver="${{ github.ref_name }}"; ver="${ver#v}"
          out="ClipTrail_${ver}_android-arm64.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          # tauri-action creates the draft release once a desktop build finishes.
          for i in $(seq 1 40); do gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break; sleep 45; done
          gh release upload "${{ github.ref_name }}" "$out" "$out.sha256" --clobber

  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: clipd.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bin: clipd }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bin: clipd }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev
      - run: cargo build --release -p clipd-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="clipd-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$name/"
          cp LICENSE README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          ls
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break; sleep 30; done
          # install.sh downloads a tarball and its .sha256.
          gh release upload "${{ github.ref_name }}" $(ls clipd-*.zip clipd-*.tar.gz clipd-*.sha256 2>/dev/null) --clobber
