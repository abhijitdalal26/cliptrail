name: Release

# Push a tag like v0.1.0 to build installers and publish a draft GitHub
# release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos (experimental)
            os: macos-latest
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins channel "1.96", which rustup treats as a
      # different toolchain from the "1.96.1" the step above installed, so
      # the targets added there are not visible to cargo. Add them to the
      # toolchain the repo actually selects (v0.1.0 failed here with
      # "Target x86_64-apple-darwin is not installed").
      - name: macOS targets for the universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages (tauri.conf.json createUpdaterArtifacts).
          # The matching public key is in tauri.conf.json plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ClipTrail ${{ github.ref_name }}"
          releaseBody: |
            Install: Windows → the `-setup.exe` (or `.msi`); Android → the `.apk` (sideload; setup guide: https://abhijitdalal26.github.io/cliptrail/docs/android.html); Linux → `.deb` or `.AppImage`; macOS (experimental, universal: Apple silicon + Intel) → `.dmg`.
            Builds are not code-signed yet: Windows shows "Windows protected your PC" → More info → Run anyway.
            macOS: drag ClipTrail to Applications, then on first launch System Settings → Privacy & Security → Open Anyway (or run `xattr -dr com.apple.quarantine /Applications/ClipTrail.app`).
          releaseDraft: true
          prerelease: true
          # Uploads latest.json (+ .sig files) next to the installers; the app's
          # update check reads releases/latest/download/latest.json. Note that
          # "latest" skips drafts and pre-releases, so untick "pre-release"
          # when publishing a version you want installed apps to be offered.
          # (tauri-action v0 input; v1 calls it uploadUpdaterJson.)
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      # Code signing (docs/code-signing.md): hand the unsigned Windows
      # installers to the windows-sign job. Only runs once the SignPath
      # repository variables are set; until then releases stay unsigned.
      - name: Keep unsigned Windows installers for SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 3

  # Signs the Windows installers through SignPath Foundation, then replaces
  # them in the draft release. Authenticode signing changes the files, so the
  # Tauri updater signatures (.sig and latest.json) are recomputed afterwards,
  # or installed apps would refuse the update.
  windows-sign:
    name: Windows code signing (SignPath)
    needs: desktop
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    # Each signing request waits for a manual approval in SignPath.
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Find the unsigned artifact
        id: unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            -q '.artifacts[] | select(.name == "windows-unsigned") | .id')
          test -n "$id" || { echo "::error::windows-unsigned artifact not found"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Sign with SignPath
        id: sign
        # Pinned to the v3 commit: this step sees the SignPath token.
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'cliptrail' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-installers' }}
          github-artifact-id: ${{ steps.unsigned.outputs.id }}
          wait-for-completion: true
          # Time for the approver to approve the request in SignPath.
          wait-for-completion-timeout-in-seconds: 6000
          output-artifact-directory: signed
          # SignPath checks that the files carry this ProductVersion.
          parameters: |
            version: ${{ toJSON(steps.unsigned.outputs.version) }}
      - name: Check the signatures
        run: |
          sudo apt-get install -y osslsigncode >/dev/null
          for f in signed/nsis/*-setup.exe signed/msi/*.msi; do
            test -f "$f" || { echo "::error::missing signed file: $f"; exit 1; }
            osslsigncode verify -in "$f" | grep -q "Signature verification: ok" \
              || { echo "::error::$f is not validly signed"; osslsigncode verify -in "$f"; exit 1; }
            echo "signed: $f"
          done
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install the Tauri CLI
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Recompute updater signatures
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in ../../signed/nsis/*-setup.exe ../../signed/msi/*.msi; do
            pnpm tauri signer sign "$f"
          done
          ls -la ../../signed/nsis ../../signed/msi
      - name: Replace the installers in the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" signed/nsis/* signed/msi/* --clobber
          # Point the Windows entries of latest.json at the new signatures.
          gh release download "$TAG" -p latest.json -D before --clobber
          python3 .github/scripts/update_latest_json.py before/latest.json signed latest.json
          gh release upload "$TAG" latest.json --clobber
          # Drop the "not code-signed" note from the release text.
          gh release view "$TAG" --json body -q .body \
            | sed 's/^Builds are not code-signed yet: Windows shows "Windows protected your PC" → More info → Run anyway\.$/Windows installers are code-signed (free code signing provided by SignPath.io, certificate by SignPath Foundation)./' > body.md
          gh release edit "$TAG" --notes-file body.md

  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # Sideloaded APK (not on Play). The same key must sign every release or
      # installed apps can't update; see docs/release.md.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets are not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=cliptrail"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > apps/desktop/src-tauri/gen/android/keystore.properties
      - name: Build APK
        working-directory: apps/desktop
        run: pnpm tauri android build --apk --target aarch64
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n1)
          test -n "$apk" || { echo "::error::no release APK found"; exit 1; }
          ver="${{ github.ref_name }}"; ver="${ver#v}"
          out="ClipTrail_${ver}_android-arm64.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          # tauri-action creates the draft release once a desktop build finishes.
          for i in $(seq 1 40); do gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break; sleep 45; done
          gh release upload "${{ github.ref_name }}" "$out" "$out.sha256" --clobber

  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: clipd.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bin: clipd }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bin: clipd }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev
      - run: cargo build --release -p clipd-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="clipd-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$name/"
          cp LICENSE README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          ls
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tauri-action creates the draft release once a desktop build
          # finishes (~10 min); v0.1.0's CLI jobs gave up after 3 min.
          for i in $(seq 1 40); do gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break; sleep 45; done
          # install.sh downloads a tarball and its .sha256.
          gh release upload "${{ github.ref_name }}" $(ls clipd-*.zip clipd-*.tar.gz clipd-*.sha256 2>/dev/null) --clobber
