[workspace]
resolver = "3"
members = ["crates/clipd-core", "crates/clipd-capture", "crates/clipd-sync", "crates/clipd-relay", "crates/clipd-cli", "crates/clipd-mcp", "apps/desktop/src-tauri"]
# Vendored, patched dependencies; not ours to lint or test.
exclude = ["third_party"]

# Bundled SQLite is built as SQLite3 Multiple Ciphers (encrypted databases).
# See third_party/README.md.
[patch.crates-io]
libsqlite3-sys = { path = "third_party/libsqlite3-sys" }

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/abhijitdalal26/cliptrail"

[workspace.dependencies]
clipd-core = { path = "crates/clipd-core" }
clipd-capture = { path = "crates/clipd-capture" }
clipd-sync = { path = "crates/clipd-sync", default-features = false }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
ulid = "3"
sha2 = "0.11"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
windows-sys = "0.61"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3"

# Build scripts and proc-macros only; shipped binaries are unchanged. On macOS
# 27, dyld refuses proc-macro dylibs that were stripped with a deployment target
# of 12.0+ (Tauri sets MACOSX_DEPLOYMENT_TARGET from minimumSystemVersion):
# "mis-aligned LINKEDIT string pool", which surfaces as E0463 for serde_derive.
[profile.release.build-override]
strip = "none"
