[package]
name = "cliptrail-desktop"
description = "ClipTrail desktop app (Tauri 2): dashboard, quick picker, tray"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "cliptrail"

[[bin]]
name = "cliptrail"
path = "src/main.rs"

[lib]
name = "cliptrail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
clipd-core.workspace = true
# Client only (no hub, no OS keychain); desktop adds those features below.
clipd-sync.workspace = true
tokio = { version = "1", features = ["sync"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-opener = "2.7"

# Desktop (Windows / Linux / macOS): clipboard watcher, tray, hotkeys,
# login item, single instance, and the LAN sync hub. With resolver 3 these
# features and crates never reach Android/iOS builds.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
clipd-capture.workspace = true
clipd-sync = { workspace = true, features = ["hub", "os-keychain"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
# Optional, user-enabled update check against GitHub Releases (desktop only;
# Android is updated as an APK). Relaunch uses tauri's own AppHandle::restart.
tauri-plugin-updater = "2.14"

# Mica / acrylic backdrop; Windows only (Linux falls back to opaque windows).
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"

# macOS picker: NonactivatingPanel style mask + orderFrontRegardless so the
# picker shows without activating the app (target app keeps focus).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }

# Android: JNI entry points for the Kotlin capture services (same .so).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
image.workspace = true
