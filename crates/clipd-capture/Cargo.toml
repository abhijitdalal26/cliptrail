[package]
name = "clipd-capture"
description = "ClipTrail desktop platform glue: clipboard watcher, clipboard write-back, paste-back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clipd-core.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
image.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: X11 via pure-Rust x11rb (no libxcb needed at build time), Wayland via
# wl-clipboard-rs (wlr/ext data-control protocols; KDE, Sway, Hyprland).
[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }
wl-clipboard-rs = "0.9"
