[package]
name = "clipd-capture"
description = "ClipTrail desktop platform glue: clipboard watcher, clipboard write-back, paste-back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clipd-core.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
image.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: X11 via pure-Rust x11rb (no libxcb needed at build time), Wayland via
# wl-clipboard-rs (wlr/ext data-control protocols; KDE, Sway, Hyprland).
[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }
wl-clipboard-rs = "0.9"

# macOS: NSPasteboard / NSWorkspace / CGEvent via the objc2 family (MIT).
[target.'cfg(target_os = "macos")'.dependencies]
image.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGEvent"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSEnumerator",
    "NSRunLoop",
    "NSString",
    "NSURL",
] }
