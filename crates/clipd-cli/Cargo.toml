[package]
name = "clipd-cli"
description = "ClipTrail command-line tool: watch, list, search, stats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clipd"
path = "src/main.rs"

[dependencies]
clipd-core.workspace = true
clipd-capture.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
ctrlc.workspace = true
clipd-sync = { workspace = true, features = ["hub", "os-keychain"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
image.workspace = true
